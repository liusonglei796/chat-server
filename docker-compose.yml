services:
  mysql:
    image: mysql:8.0
    container_name: chat-mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root123456
      MYSQL_DATABASE: chat
    volumes:
      - mysql_data:/var/lib/mysql
      - ./migrations/split_db.sql:/docker-entrypoint-initdb.d/split_db.sql:ro
    command: --default-authentication-plugin=mysql_native_password --slow_query_log=ON --long_query_time=1 --slow_query_log_file=/var/lib/mysql/slow-query.log
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: chat-redis
    ports:
      - "6385:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  kafka:
    image: apache/kafka:4.1.1
    container_name: chat-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server kafka:9092"]
      interval: 10s
      timeout: 10s
      retries: 15
    restart: unless-stopped

  etcd:
    image: bitnami/etcd:3.5
    container_name: chat-etcd
    ports:
      - "2379:2379"
      - "2380:2380"
    environment:
      - ALLOW_NONE_AUTHENTICATION=yes
      - ETCD_ADVERTISE_CLIENT_URLS=http://0.0.0.0:2379
    restart: unless-stopped

  tempo:
    image: grafana/tempo:2.10.4
    container_name: chat-tempo
    ports:
      - "4317:4317" # OTLP gRPC 接收端
      - "3200:3200" # Tempo 查询 API / UI
    volumes:
      - ./configs/tempo.yaml:/etc/tempo.yaml:ro
    command: ["-config.file=/etc/tempo.yaml"]
    restart: unless-stopped

  chat-server:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_PATH: ./cmd/gateway
    container_name: chat-server
    ports:
      - "8081:8000"
    volumes:
      - ./configs/config.toml:/app/configs/config.toml:ro
      - static_data:/app/static
    depends_on:
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      etcd:
        condition: service_started
    restart: unless-stopped

  user-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_PATH: ./cmd/user_service
    container_name: user-service
    environment:
      MYSQL_USER: svc_user
      MYSQL_PASSWORD: svc_user_pwd
      DB_NAME: chat_user
    volumes:
      - ./configs/config.toml:/app/configs/config.toml:ro
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      etcd:
        condition: service_started
    restart: unless-stopped

  apply-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_PATH: ./cmd/apply_service
    container_name: apply-service
    environment:
      MYSQL_USER: svc_apply
      MYSQL_PASSWORD: svc_apply_pwd
      DB_NAME: chat_apply
    volumes:
      - ./configs/config.toml:/app/configs/config.toml:ro
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      etcd:
        condition: service_started
    restart: unless-stopped

  friendship-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_PATH: ./cmd/friendship_service
    container_name: friendship-service
    environment:
      MYSQL_USER: svc_friendship
      MYSQL_PASSWORD: svc_friendship_pwd
      DB_NAME: chat_friendship
    volumes:
      - ./configs/config.toml:/app/configs/config.toml:ro
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      etcd:
        condition: service_started
    restart: unless-stopped

  group-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_PATH: ./cmd/group_service
    container_name: group-service
    environment:
      MYSQL_USER: svc_group
      MYSQL_PASSWORD: svc_group_pwd
      DB_NAME: chat_group
    volumes:
      - ./configs/config.toml:/app/configs/config.toml:ro
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      etcd:
        condition: service_started
    restart: unless-stopped

  message-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_PATH: ./cmd/message_service
    container_name: message-service
    environment:
      MYSQL_USER: svc_message
      MYSQL_PASSWORD: svc_message_pwd
      DB_NAME: chat_message
    volumes:
      - ./configs/config.toml:/app/configs/config.toml:ro
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      etcd:
        condition: service_started
    restart: unless-stopped

volumes:
  mysql_data:
  redis_data:
  static_data:
