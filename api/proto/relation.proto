syntax = "proto3";

package relation;

option go_package = "kama_chat_server/api/gen/relation";

service RelationService {
    // Friendship
    rpc GetFriendList (GetFriendListRequest) returns (GetFriendListResponse);
    rpc GetFriendInfo (GetFriendInfoRequest) returns (GetFriendInfoResponse);
    rpc DeleteFriend (DeleteFriendRequest) returns (DeleteFriendResponse);
    rpc BlackFriend (BlackFriendRequest) returns (BlackFriendResponse);
    rpc UnblackFriend (UnblackFriendRequest) returns (UnblackFriendResponse);
    rpc UpdateRemark (UpdateRemarkRequest) returns (UpdateRemarkResponse);

    // Group
    rpc CreateGroup (CreateGroupRequest) returns (CreateGroupResponse);
    rpc LoadMyGroup (LoadMyGroupRequest) returns (LoadMyGroupResponse);
    rpc GetGroupListByMember (GetGroupListByMemberRequest) returns (GetGroupListByMemberResponse);
    rpc CheckGroupAddMode (CheckGroupAddModeRequest) returns (CheckGroupAddModeResponse);
    rpc LeaveGroup (LeaveGroupRequest) returns (LeaveGroupResponse);
    rpc DismissGroup (DismissGroupRequest) returns (DismissGroupResponse);
    rpc UpdateGroupInfo (UpdateGroupInfoRequest) returns (UpdateGroupInfoResponse);
    rpc GetGroupMemberList (GetGroupMemberListRequest) returns (GetGroupMemberListResponse);
    rpc RemoveGroupMembers (RemoveGroupMembersRequest) returns (RemoveGroupMembersResponse);
    rpc GetGroupDetail (GetGroupDetailRequest) returns (GetGroupDetailResponse);
    rpc MuteMember (MuteMemberRequest) returns (MuteMemberResponse);

    // Apply
    rpc ApplyFriend (ApplyFriendRequest) returns (ApplyFriendResponse);
    rpc ApplyGroup (ApplyGroupRequest) returns (ApplyGroupResponse);
    rpc GetFriendApplyList (GetFriendApplyListRequest) returns (GetFriendApplyListResponse);
    rpc GetGroupApplyList (GetGroupApplyListRequest) returns (GetGroupApplyListResponse);
    rpc PassFriendApply (PassFriendApplyRequest) returns (PassFriendApplyResponse);
    rpc PassGroupApply (PassGroupApplyRequest) returns (PassGroupApplyResponse);
    rpc RefuseFriendApply (RefuseFriendApplyRequest) returns (RefuseFriendApplyResponse);
    rpc RefuseGroupApply (RefuseGroupApplyRequest) returns (RefuseGroupApplyResponse);
    rpc BlackFriendApply (BlackFriendApplyRequest) returns (BlackFriendApplyResponse);
    rpc BlackGroupApply (BlackGroupApplyRequest) returns (BlackGroupApplyResponse);

    // 检查好友关系状态：0=非好友 1=正常 2=已拉黑对方 3=被对方拉黑
    rpc CheckFriendship (CheckFriendshipRequest) returns (CheckFriendshipResponse);
    // 检查用户是否为群成员
    rpc CheckGroupMember (CheckGroupMemberRequest) returns (CheckGroupMemberResponse);
    // 获取群全部成员ID（供消息服务群发用，不要求调用方是成员）
    rpc ListGroupMemberIds (ListGroupMemberIdsRequest) returns (ListGroupMemberIdsResponse);
}

// Friendship Messages
message GetFriendListRequest {
    string user_id = 1;
    int32 page = 2;
    int32 page_size = 3;
}
message MyUserListRespond {
    string user_id = 1;
    string user_name = 2;
    string avatar = 3;
}
message GetFriendListResponse {
    int64 total = 1;
    repeated MyUserListRespond list = 2;
}

message GetFriendInfoRequest {
    string user_id = 1;
    string friend_id = 2;
}
message GetFriendInfoResponse {
    string friend_id = 1;
    string friend_name = 2;
    string friend_avatar = 3;
    string friend_birthday = 4;
    string friend_email = 5;
    string friend_phone = 6;
    int32 friend_gender = 7;
    string friend_signature = 8;
    string remark = 9;
}

message DeleteFriendRequest {
    string user_id = 1;
    string friend_id = 2;
}
message DeleteFriendResponse {}

message BlackFriendRequest {
    string user_id = 1;
    string friend_id = 2;
}
message BlackFriendResponse {}

message UnblackFriendRequest {
    string user_id = 1;
    string friend_id = 2;
}
message UnblackFriendResponse {}

message UpdateRemarkRequest {
    string user_id = 1;
    string friend_id = 2;
    string remark = 3;
}
message UpdateRemarkResponse {}

// Group Messages
message CreateGroupRequest {
    string owner_id = 1;
    string name = 2;
    string notice = 3;
    int32 add_mode = 4;
    string avatar = 5;
}
message CreateGroupResponse {}

message LoadMyGroupRequest {
    string user_id = 1;
    int32 page = 2;
    int32 page_size = 3;
}
message MyGroupListRespond {
    string group_id = 1;
    string group_name = 2;
    string avatar = 3;
}
message LoadMyGroupResponse {
    int64 total = 1;
    repeated MyGroupListRespond list = 2;
}

message GetGroupListByMemberRequest {
    string user_id = 1;
    int32 page = 2;
    int32 page_size = 3;
}
message GetGroupListByMemberResponse {
    int64 total = 1;
    repeated MyGroupListRespond list = 2;
}

message CheckGroupAddModeRequest {
    string group_id = 1;
}
message CheckGroupAddModeResponse {
    int32 add_mode = 1;
}

message LeaveGroupRequest {
    string user_id = 1;
    string group_id = 2;
}
message LeaveGroupResponse {}

message DismissGroupRequest {
    string operator_id = 1;
    string group_id = 2;
}
message DismissGroupResponse {}

message UpdateGroupInfoRequest {
    string operator_id = 1;
    string uuid = 2;
    optional string name = 3;
    optional string notice = 4;
    optional int32 add_mode = 5;
    optional string avatar = 6;
}
message UpdateGroupInfoResponse {}

message GetGroupMemberListRequest {
    string user_id = 1;
    string group_id = 2;
    int32 page = 3;
    int32 page_size = 4;
}
message GetGroupMemberListRespond {
    string user_id = 1;
    string nickname = 2;
    string avatar = 3;
}
message GetGroupMemberListResponse {
    int64 total = 1;
    repeated GetGroupMemberListRespond list = 2;
}

message RemoveGroupMembersRequest {
    string operator_id = 1;
    string group_id = 2;
    repeated string uuid_list = 3;
}
message RemoveGroupMembersResponse {}

message GetGroupDetailRequest {
    string user_id = 1;
    string group_id = 2;
}
message GetGroupDetailResponse {
    string group_id = 1;
    string group_name = 2;
    string group_avatar = 3;
    string group_notice = 4;
    int32 member_cnt = 5;
    string owner_id = 6;
    int32 add_mode = 7;
}

message MuteMemberRequest {
    string operator_id = 1;
    string group_id = 2;
    string user_id = 3;
    int64 duration = 4;
}
message MuteMemberResponse {}

// Apply Messages
message ApplyFriendRequest {
    string user_id = 1;
    string friend_id = 2;
    string message = 3;
}
message ApplyFriendResponse {}

message ApplyGroupRequest {
    string user_id = 1;
    string group_id = 2;
    string message = 3;
}
message ApplyGroupResponse {}

message GetFriendApplyListRequest {
    string user_id = 1;
    int32 page = 2;
    int32 page_size = 3;
}
message FriendApplyListRespond {
    string applicant_id = 1;
    string applicant_name = 2;
    string applicant_avatar = 3;
    string message = 4;
}
message GetFriendApplyListResponse {
    int64 total = 1;
    repeated FriendApplyListRespond list = 2;
}

message GetGroupApplyListRequest {
    string operator_id = 1;
    string group_id = 2;
    int32 page = 3;
    int32 page_size = 4;
}
message GroupApplyListRespond {
    string applicant_id = 1;
    string applicant_name = 2;
    string applicant_avatar = 3;
    string message = 4;
}
message GetGroupApplyListResponse {
    int64 total = 1;
    repeated GroupApplyListRespond list = 2;
}

message PassFriendApplyRequest {
    string user_id = 1;
    string applicant_id = 2;
}
message PassFriendApplyResponse {}

message PassGroupApplyRequest {
    string operator_id = 1;
    string group_id = 2;
    string applicant_id = 3;
}
message PassGroupApplyResponse {}

message RefuseFriendApplyRequest {
    string user_id = 1;
    string applicant_id = 2;
}
message RefuseFriendApplyResponse {}

message RefuseGroupApplyRequest {
    string operator_id = 1;
    string group_id = 2;
    string applicant_id = 3;
}
message RefuseGroupApplyResponse {}

message BlackFriendApplyRequest {
    string user_id = 1;
    string applicant_id = 2;
}
message BlackFriendApplyResponse {}

message BlackGroupApplyRequest {
    string operator_id = 1;
    string group_id = 2;
    string applicant_id = 3;
}
message BlackGroupApplyResponse {}

message CheckFriendshipRequest {
    string user_id = 1;
    string friend_id = 2;
}
message CheckFriendshipResponse {
    int32 status = 1;
}

message CheckGroupMemberRequest {
    string group_id = 1;
    string user_id = 2;
}
message CheckGroupMemberResponse {
    bool is_member = 1;
}

message ListGroupMemberIdsRequest {
    string group_id = 1;
}
message ListGroupMemberIdsResponse {
    repeated string user_ids = 1;
}

