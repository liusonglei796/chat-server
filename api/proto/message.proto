syntax = "proto3";

package message;

import "google/api/annotations.proto";

option go_package = "kama_chat_server/api/gen/message";

service MessageService {
    // Message
    rpc SendMessage (SendMessageRequest) returns (SendMessageResponse) {
        option (google.api.http) = {
            post: "/messages/send"
            body: "*"
        };
    }
    rpc GetMessageList (GetMessageListRequest) returns (GetMessageListResponse);
    rpc GetGroupMessageList (GetGroupMessageListRequest) returns (GetGroupMessageListResponse);
    rpc GetMessageListCursor (GetMessageListCursorRequest) returns (GetMessageListCursorResponse) {
        option (google.api.http) = {
            get: "/messages/direct"
        };
    }
    rpc GetGroupMessageListCursor (GetGroupMessageListCursorRequest) returns (GetGroupMessageListCursorResponse) {
        option (google.api.http) = {
            get: "/messages/group"
        };
    }
    rpc GetMessages (GetMessagesRequest) returns (GetMessagesResponse) {
        option (google.api.http) = {
            get: "/messages"
        };
    }
    rpc RecallMessage (RecallMessageRequest) returns (RecallMessageResponse) {
        option (google.api.http) = {
            post: "/messages/recall"
            body: "*"
        };
    }
    
    // Session
    rpc CreateSession (CreateSessionRequest) returns (CreateSessionResponse);
    rpc CheckOpenSessionAllowed (CheckOpenSessionAllowedRequest) returns (CheckOpenSessionAllowedResponse) {
        option (google.api.http) = {
            get: "/sessions/check"
        };
    }
    rpc OpenSession (OpenSessionRequest) returns (OpenSessionResponse) {
        option (google.api.http) = {
            post: "/sessions"
            body: "*"
        };
    }
    rpc GetUserSessionList (GetUserSessionListRequest) returns (GetUserSessionListResponse);
    rpc GetGroupSessionList (GetGroupSessionListRequest) returns (GetGroupSessionListResponse);
    rpc GetUserSessionListCursor (GetUserSessionListCursorRequest) returns (GetUserSessionListCursorResponse) {
        option (google.api.http) = {
            get: "/sessions/direct"
        };
    }
    rpc GetGroupSessionListCursor (GetGroupSessionListCursorRequest) returns (GetGroupSessionListCursorResponse) {
        option (google.api.http) = {
            get: "/sessions/group"
        };
    }
    rpc DeleteSession (DeleteSessionRequest) returns (DeleteSessionResponse) {
        option (google.api.http) = {
            delete: "/sessions"
            body: "*"
            additional_bindings {
                delete: "/sessions/{session_id}"
            }
        };
    }
    rpc PinSession (PinSessionRequest) returns (PinSessionResponse) {
        option (google.api.http) = {
            put: "/sessions/pin"
            body: "*"
        };
    }
    rpc DeleteGroupMemberSessions (DeleteGroupMemberSessionsRequest) returns (DeleteGroupMemberSessionsResponse);
    rpc CreateGroupSession (CreateGroupSessionRequest) returns (CreateGroupSessionResponse);
    rpc DeleteFriendSessions (DeleteFriendSessionsRequest) returns (DeleteFriendSessionsResponse);
}

// Message Requests/Responses
message SendMessageRequest {
    string session_id = 1;
    // 0 文本、2 文件、4 撤回；1/3 为历史保留值，服务端不再支持。
    int32 type = 2;
    string content = 3;
    string url = 4;
    string send_id = 5;
    string send_name = 6;
    string send_avatar = 7;
    string receive_id = 8;
    string file_size = 9;
    string file_type = 10;
    string file_name = 11;
    string client_msg_id = 13;

    // 音视频通话已移除，保留字段编号，避免旧客户端字段被重新使用。
    reserved 12;
    reserved "av_data";
}

message SendMessageResponse {
    string message_uuid = 1;
    string created_at = 2;
}

message GetMessageListRequest {
    string requester_id = 1;
    string partner_id = 2;
    int32 page = 3;
    int32 page_size = 4;
}
message GetMessageListRespond {
    string send_id = 1;
    string send_name = 2;
    string send_avatar = 3;
    string receive_id = 4;
    string content = 5;
    string url = 6;
    int32 type = 7;
    string file_type = 8;
    string file_name = 9;
    int64 file_size = 10;
    string created_at = 11;
    int64 seq_id = 12;
}
message GetMessageListResponse {
    int64 total = 1;
    repeated GetMessageListRespond list = 2;
}

message GetGroupMessageListRequest {
    string user_id = 1;
    string group_id = 2;
    int32 page = 3;
    int32 page_size = 4;
}
message GetGroupMessageListResponse {
    int64 total = 1;
    repeated GetMessageListRespond list = 2;
}

message GetMessageListCursorRequest {
    string requester_id = 1;
    string partner_id = 2;
    string cursor = 3;
    int32 page_size = 4;
}
message GetMessageListCursorResponse {
    repeated GetMessageListRespond list = 1;
    string next_cursor = 2;
    bool has_more = 3;
}

message GetGroupMessageListCursorRequest {
    string user_id = 1;
    string group_id = 2;
    string cursor = 3;
    int32 page_size = 4;
}
message GetGroupMessageListCursorResponse {
    repeated GetMessageListRespond list = 1;
    string next_cursor = 2;
    bool has_more = 3;
}

message RecallMessageRequest {
    string user_id = 1;
    string message_uuid = 2;
}
message RecallMessageResponse {}

message GetMessagesRequest {
    string target_id = 1;
    string cursor = 2;
    int32 page_size = 3;
    string requester_id = 4;
}

message GetMessagesResponse {
    repeated GetMessageListRespond list = 1;
    string next_cursor = 2;
    bool has_more = 3;
}

// Session Requests/Responses
message CreateSessionRequest {
    string send_id = 1;
    string receive_id = 2;
}
message CreateSessionResponse {
    string session_id = 1;
}

message CheckOpenSessionAllowedRequest {
    string send_id = 1;
    string receive_id = 2;
    string target_id = 3;
}
message CheckOpenSessionAllowedResponse {
    bool allowed = 1;
}

message OpenSessionRequest {
    string send_id = 1;
    string receive_id = 2;
    string client_token = 3;
}
message OpenSessionResponse {
    string session_id = 1;
}

message GetUserSessionListRequest {
    string owner_id = 1;
    int32 page = 2;
    int32 page_size = 3;
}
message UserSessionListRespond {
    string session_id = 1;
    string avatar = 2;
    string user_id = 3;
    string username = 4;
    string last_message = 5;
    string last_message_time = 6;
    int32 last_message_type = 7;
    int32 is_pinned = 8;
}
message GetUserSessionListResponse {
    int64 total = 1;
    repeated UserSessionListRespond list = 2;
}

message GetGroupSessionListRequest {
    string owner_id = 1;
    int32 page = 2;
    int32 page_size = 3;
}
message GroupSessionListRespond {
    string session_id = 1;
    string avatar = 2;
    string group_id = 3;
    string group_name = 4;
    string last_message = 5;
    string last_message_time = 6;
    int32 last_message_type = 7;
    int32 is_pinned = 8;
}
message GetGroupSessionListResponse {
    int64 total = 1;
    repeated GroupSessionListRespond list = 2;
}

message GetUserSessionListCursorRequest {
    string owner_id = 1;
    string cursor = 2;
    int32 page_size = 3;
}
message GetUserSessionListCursorResponse {
    repeated UserSessionListRespond list = 1;
    string next_cursor = 2;
    bool has_more = 3;
}

message GetGroupSessionListCursorRequest {
    string owner_id = 1;
    string cursor = 2;
    int32 page_size = 3;
}
message GetGroupSessionListCursorResponse {
    repeated GroupSessionListRespond list = 1;
    string next_cursor = 2;
    bool has_more = 3;
}

message DeleteSessionRequest {
    string owner_id = 1;
    string session_id = 2;
}
message DeleteSessionResponse {}

message PinSessionRequest {
    string user_id = 1;
    string session_id = 2;
    bool is_pinned = 3;
}
message PinSessionResponse {}

message DeleteGroupMemberSessionsRequest {
    string group_id = 1;
    repeated string user_ids = 2;
}
message DeleteGroupMemberSessionsResponse {}

message CreateGroupSessionRequest {
    string group_id = 1;
    string user_id = 2;
    string group_name = 3;
    string group_avatar = 4;
}
message CreateGroupSessionResponse {
    string session_id = 1;
}

message DeleteFriendSessionsRequest {
    string user_one_id = 1;
    string user_two_id = 2;
}
message DeleteFriendSessionsResponse {}
