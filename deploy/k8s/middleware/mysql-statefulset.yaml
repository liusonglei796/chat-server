apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mysql
  namespace: chat-system
spec:
  serviceName: "mysql"
  replicas: 1
  selector:
    matchLabels:
      app: mysql
  template:
    metadata:
      labels:
        app: mysql
    spec:
      containers:
        - name: mysql
          image: mysql:8.0
          ports:
            - containerPort: 3306
          env:
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: chat-secrets
                  key: MYSQL_PASSWORD
            - name: MYSQL_DATABASE
              value: "chat"
          command: ["mysqld"]
          args:
            - "--default-authentication-plugin=mysql_native_password"
            - "--slow_query_log=ON"
            - "--long_query_time=1"
            - "--slow_query_log_file=/var/lib/mysql/slow-query.log"
          volumeMounts:
            - name: mysql-data
              mountPath: /var/lib/mysql
  volumeClaimTemplates:
    - metadata:
        name: mysql-data
      spec:
        accessModes: [ "ReadWriteOnce" ]
        resources:
          requests:
            storage: 10Gi
---
apiVersion: v1
kind: Service
metadata:
  name: mysql
  namespace: chat-system
spec:
  ports:
    - port: 3306
  selector:
    app: mysql
