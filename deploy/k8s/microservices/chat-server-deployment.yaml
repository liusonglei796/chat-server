apiVersion: apps/v1
kind: Deployment
metadata:
  name: chat-server
  namespace: chat-system
  labels:
    app: chat-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: chat-server
  template:
    metadata:
      labels:
        app: chat-server
    spec:
      containers:
        - name: chat-server
          image: kama-chat/chat-server:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
            - containerPort: 8001
          env:
            - name: ETCD_ENDPOINTS
              value: "etcd:2379"
            # 【关键】网关把该地址注册到 Redis 的 user:gateway:<userId>，
            # message_service 依此回推下行消息。若为 127.0.0.1，
            # message_service 会连到自己 Pod 的回环地址，推送静默失败。
            - name: GATEWAY_GRPC_ADDR
              value: "chat-server:8001"
            - name: GATEWAY_GRPC_PORT
              value: "8001"
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: chat-secrets
                  key: MYSQL_PASSWORD
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: chat-secrets
                  key: REDIS_PASSWORD
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: chat-secrets
                  key: JWT_SECRET
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          readinessProbe:
            tcpSocket:
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20
          volumeMounts:
            - name: config-volume
              mountPath: /app/configs/config.toml
              subPath: config.toml
            - name: static-volume
              mountPath: /app/static

      volumes:
        - name: config-volume
          configMap:
            name: chat-config
        - name: static-volume
          persistentVolumeClaim:
            claimName: chat-static-pvc

---
apiVersion: v1
kind: Service
metadata:
  name: chat-server
  namespace: chat-system
spec:
  selector:
    app: chat-server
  ports:
    - protocol: TCP
      name: http-ws
      port: 8000
      targetPort: 8000
    - protocol: TCP
      name: grpc
      port: 8001
      targetPort: 8001
