apiVersion: apps/v1
kind: Deployment
metadata:
  name: message-service
  namespace: chat-system
  labels:
    app: message-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: message-service
  template:
    metadata:
      labels:
        app: message-service
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values:
                        - message-service
                topologyKey: "kubernetes.io/hostname"
      containers:
        - name: message-service
          image: myregistry.com/message-service:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 50054
          env:
            - name: ETCD_ENDPOINTS
              value: "etcd:2379"
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          readinessProbe:
            tcpSocket:
              port: 50054
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 50054
            initialDelaySeconds: 15
            periodSeconds: 20
          volumeMounts:
            - name: config-volume
              mountPath: /app/configs/config.toml
              subPath: config.toml

      volumes:
        - name: config-volume
          configMap:
            name: chat-config

---
apiVersion: v1
kind: Service
metadata:
  name: message-service
  namespace: chat-system
spec:
  selector:
    app: message-service
  ports:
    - protocol: TCP
      port: 50054
      targetPort: 50054
