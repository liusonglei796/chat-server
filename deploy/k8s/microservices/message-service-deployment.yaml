apiVersion: apps/v1
kind: Deployment
metadata:
  name: message-service
  namespace: chat-system
  labels:
    app: message-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: message-service
  template:
    metadata:
      labels:
        app: message-service
    spec:
      containers:
        - name: message-service
          image: kama-chat/message-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            # 【修复】旧 manifest 占用了 50054，那是 friendship_service 的端口。
            # message_service 实际监听 50056（cmd/message_service/main.go）。
            - containerPort: 50056
          env:
            - name: ETCD_ENDPOINTS
              value: "etcd:2379"
            - name: DB_NAME
              value: "chat_message"
            - name: MYSQL_USER
              value: "svc_message"
            - name: MYSQL_PASSWORD
              value: "svc_message_pwd"
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: chat-secrets
                  key: REDIS_PASSWORD
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: chat-secrets
                  key: JWT_SECRET
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          readinessProbe:
            tcpSocket:
              port: 50056
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 50056
            initialDelaySeconds: 15
            periodSeconds: 20
          volumeMounts:
            - name: config-volume
              mountPath: /app/configs/config.toml
              subPath: config.toml

      volumes:
        - name: config-volume
          configMap:
            name: chat-config

---
apiVersion: v1
kind: Service
metadata:
  name: message-service
  namespace: chat-system
spec:
  selector:
    app: message-service
  ports:
    - protocol: TCP
      port: 50056
      targetPort: 50056
