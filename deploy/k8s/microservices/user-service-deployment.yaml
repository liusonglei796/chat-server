apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-service
  namespace: chat-system
  labels:
    app: user-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: user-service
  template:
    metadata:
      labels:
        app: user-service
    spec:
      containers:
        - name: user-service
          image: kama-chat/user-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 50051
          env:
            - name: ETCD_ENDPOINTS
              value: "etcd:2379"
            # 拆库：user_service 只访问 chat_user
            - name: DB_NAME
              value: "chat_user"
            - name: MYSQL_USER
              value: "svc_user"
            - name: MYSQL_PASSWORD
              value: "svc_user_pwd"
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: chat-secrets
                  key: REDIS_PASSWORD
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: chat-secrets
                  key: JWT_SECRET
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          readinessProbe:
            tcpSocket:
              port: 50051
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 50051
            initialDelaySeconds: 15
            periodSeconds: 20
          volumeMounts:
            - name: config-volume
              mountPath: /app/configs/config.toml
              subPath: config.toml

      volumes:
        - name: config-volume
          configMap:
            name: chat-config

---
apiVersion: v1
kind: Service
metadata:
  name: user-service
  namespace: chat-system
spec:
  selector:
    app: user-service
  ports:
    - protocol: TCP
      port: 50051
      targetPort: 50051
