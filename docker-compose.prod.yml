# 生产环境 docker-compose 配置
# 包含：高可用、监控、日志、优化配置

version: '3.8'

services:
  # ============ Redis 集群 ============
  redis-master:
    image: redis:7-alpine
    container_name: sms_redis_master
    ports:
      - "6379:6379"
    volumes:
      - redis_master_data:/data
    command: redis-server --appendonly yes --appendfsync everysec
    networks:
      - sms_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  redis-replica:
    image: redis:7-alpine
    container_name: sms_redis_replica
    ports:
      - "6380:6379"
    volumes:
      - redis_replica_data:/data
    command: redis-server --slaveof redis-master 6379 --appendonly yes
    depends_on:
      - redis-master
    networks:
      - sms_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: always

  # ============ 应用服务 ============
  app1:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sms_app1
    depends_on:
      redis-master:
        condition: service_healthy
    environment:
      - REDIS_URL=redis://redis-master:6379
      - ALIYUN_ACCESS_KEY=${ALIYUN_ACCESS_KEY}
      - ALIYUN_ACCESS_SECRET=${ALIYUN_ACCESS_SECRET}
      - SMS_SIGN_NAME=${SMS_SIGN_NAME}
      - SMS_TEMPLATE_ID=${SMS_TEMPLATE_ID}
      - APP_PORT=8080
      - INSTANCE_ID=app1
    ports:
      - "8081:8080"
    networks:
      - sms_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 3
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
        labels: "app=sms,instance=1"

  app2:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sms_app2
    depends_on:
      redis-master:
        condition: service_healthy
    environment:
      - REDIS_URL=redis://redis-master:6379
      - ALIYUN_ACCESS_KEY=${ALIYUN_ACCESS_KEY}
      - ALIYUN_ACCESS_SECRET=${ALIYUN_ACCESS_SECRET}
      - SMS_SIGN_NAME=${SMS_SIGN_NAME}
      - SMS_TEMPLATE_ID=${SMS_TEMPLATE_ID}
      - APP_PORT=8080
      - INSTANCE_ID=app2
    ports:
      - "8082:8080"
    networks:
      - sms_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 3
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
        labels: "app=sms,instance=2"

  # ============ Nginx 反向代理 ============
  nginx:
    image: nginx:alpine
    container_name: sms_nginx
    depends_on:
      - app1
      - app2
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs/cert.pem:/etc/nginx/certs/cert.pem:ro
      - ./certs/key.pem:/etc/nginx/certs/key.pem:ro
      - nginx_logs:/var/log/nginx
    networks:
      - sms_network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost"]
      interval: 10s
      timeout: 3s
      retries: 3
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "10"

  # ============ 监控 - Prometheus ============
  prometheus:
    image: prom/prometheus:latest
    container_name: sms_prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
    networks:
      - sms_network
    restart: always

  # ============ 监控 - Grafana ============
  grafana:
    image: grafana/grafana:latest
    container_name: sms_grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin123
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - sms_network
    restart: always

volumes:
  redis_master_data:
  redis_replica_data:
  nginx_logs:
  prometheus_data:
  grafana_data:

networks:
  sms_network:
    driver: bridge
