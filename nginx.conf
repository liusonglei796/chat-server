# Nginx 主配置文件 - SSL 终止代理
# 功能：HTTPS 接收 → HTTP 转发应用层
# 优势：应用层无需处理加解密，减轻 CPU 负担

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 10000;
    use epoll;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time ssl_protocol=$ssl_protocol';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # 速率限制（nginx 层面的固定窗口限流）
    # 1 MB 存储空间约能容纳 16000 个 IP 地址
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
    limit_req_zone $http_x_phone zone=phone_limit:10m rate=3r/m;

    # 上游应用服务器
    upstream app_backend {
        # 支持多个应用实例
        server app:8080 max_fails=3 fail_timeout=30s;
        # server app2:8080 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    # HTTP → HTTPS 重定向
    server {
        listen 80;
        server_name _;
        return 301 https://$host$request_uri;
    }

    # HTTPS 服务器 - SSL 终止入口
    server {
        listen 443 ssl http2;
        server_name _;

        # SSL 证书配置
        ssl_certificate /etc/nginx/certs/cert.pem;
        ssl_certificate_key /etc/nginx/certs/key.pem;

        # SSL 安全配置
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;

        # 安全头
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;

        # 真实 IP 传递
        set_real_ip_from 0.0.0.0/0;
        real_ip_header X-Forwarded-For;

        # ===== 验证码接口（严格限流）=====
        location /api/send-code {
            # 手机号维度限流：3 requests/minute
            limit_req zone=phone_limit burst=1 nodelay;

            # IP 维度限流：10 requests/second
            limit_req zone=api_limit burst=20 nodelay;

            # 请求方法限制
            limit_except POST {
                deny all;
            }

            # 反向代理配置
            proxy_pass http://app_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";

            # 传递客户端信息
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Host $host;

            # 超时配置
            proxy_connect_timeout 10s;
            proxy_send_timeout 10s;
            proxy_read_timeout 10s;

            # 错误处理
            proxy_intercept_errors on;
            error_page 502 503 504 /error.json;
        }

        # ===== 验证码校验接口 =====
        location /api/verify-code {
            limit_req zone=api_limit burst=10 nodelay;

            limit_except POST {
                deny all;
            }

            proxy_pass http://app_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 5s;
            proxy_read_timeout 5s;
        }

        # ===== 登录接口 =====
        location /api/login {
            limit_req zone=api_limit burst=5 nodelay;

            limit_except POST {
                deny all;
            }

            proxy_pass http://app_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 10s;
            proxy_read_timeout 10s;
        }

        # ===== 通用 API 路由 =====
        location /api/ {
            limit_req zone=api_limit burst=30 nodelay;

            proxy_pass http://app_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Host $host;
            proxy_set_header User-Agent $http_user_agent;

            # 缓冲配置
            proxy_buffering on;
            proxy_buffer_size 4k;
            proxy_buffers 8 4k;

            # 重试配置
            proxy_next_upstream error timeout http_502 http_503;
            proxy_next_upstream_tries 2;
        }

        # ===== 健康检查端点 =====
        location /health {
            access_log off;
            proxy_pass http://app_backend;
            proxy_connect_timeout 3s;
            proxy_read_timeout 3s;
        }

        # ===== 错误页面 =====
        location = /error.json {
            default_type application/json;
            return 503 '{"error":"Service Unavailable","code":503}';
        }

        # ===== 默认 404 =====
        location / {
            return 404;
        }
    }
}
